spring.application.name=character-api

# The database URL comes from the SPRING_DATASOURCE_URL environment variable
# (set in your terminal locally and in Render's Environment settings).
# Spring Boot reads that name automatically, so no secret lives in this file.

# Create/update the characters table from the entity on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Include the exception message (e.g. "Character 99 not found") in error responses.
server.error.include-message=always

# Uncomment to see the SQL Hibernate runs:
#logging.level.org.hibernate.SQL=DEBUG

# Use the port Render provides; 8080 locally.
server.port=${PORT:8080}
